<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
<linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cf5"/><stop offset="1" stop-color="#5b8def"/></linearGradient>
<linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5c6"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
</defs>
<rect width="1200" height="780" rx="24" fill="#f8fafc"/>
<text x="48" y="58" font-size="26" font-weight="700" fill="#0f172a">生图发品 Skill:从商品图片到发品表</text>
<text x="48" y="88" font-size="15" fill="#64748b">运行在 AccioWork 里,每个关键节点都由人确认;做完导出发品表,交给客户端批量发布</text>
<rect x="32" y="112" width="1136" height="424" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
<text x="56" y="144" font-size="15" font-weight="700" fill="#6d4de0">AccioWork · 生图发品 Skill</text>
<g><rect x="56" y="164" width="320" height="124" rx="14" fill="url(#gv)"/><text x="76" y="198" font-size="19" font-weight="700" fill="#fff">① 生意校准</text><text x="76" y="226" font-size="14" fill="#ede9fe">取得企业和商品资料,分析</text><text x="76" y="248" font-size="14" fill="#ede9fe">B 端买家的需求,记下依据</text></g>
<g><rect x="440" y="164" width="320" height="124" rx="14" fill="url(#gv)"/><text x="460" y="198" font-size="19" font-weight="700" fill="#fff">② 需求确认</text><text x="460" y="226" font-size="14" fill="#ede9fe">每张图还缺什么就补问,</text><text x="460" y="248" font-size="14" fill="#ede9fe">回答存进项目档案</text></g>
<g><rect x="824" y="164" width="320" height="124" rx="14" fill="url(#gv)"/><text x="844" y="198" font-size="19" font-weight="700" fill="#fff">③ 场景规划</text><text x="844" y="226" font-size="14" fill="#ede9fe">按选定的数量规划采购场景,</text><text x="844" y="248" font-size="14" fill="#ede9fe">出一张场景表</text><rect x="844" y="258" width="112" height="24" rx="12" fill="#ffffff"/><text x="900.0" y="275" font-size="13" font-weight="700" fill="#6d4de0" text-anchor="middle">人确认场景表</text></g>
<g><rect x="824" y="340" width="320" height="124" rx="14" fill="url(#gv)"/><text x="844" y="374" font-size="19" font-weight="700" fill="#fff">④ 母版八图</text><text x="844" y="402" font-size="14" fill="#ede9fe">生成八张母版图,逐张弹出</text><text x="844" y="424" font-size="14" fill="#ede9fe">验收卡片:定稿 / 修改</text><rect x="844" y="434" width="98" height="24" rx="12" fill="#ffffff"/><text x="893.0" y="451" font-size="13" font-weight="700" fill="#6d4de0" text-anchor="middle">人逐张验收</text></g>
<g><rect x="440" y="340" width="320" height="124" rx="14" fill="url(#gv)"/><text x="460" y="374" font-size="19" font-weight="700" fill="#fff">⑤ 场景主图</text><text x="460" y="402" font-size="14" fill="#ede9fe">每个场景只换主图,</text><text x="460" y="424" font-size="14" fill="#ede9fe">共用母版的其余七张图</text></g>
<g><rect x="56" y="340" width="320" height="124" rx="14" fill="url(#gv)"/><text x="76" y="374" font-size="19" font-weight="700" fill="#fff">⑥ 标题、卖点与复审</text><text x="76" y="402" font-size="14" fill="#ede9fe">出样稿,查标题政策,核对</text><text x="76" y="424" font-size="14" fill="#ede9fe">事实和图文是否一致</text><rect x="76" y="434" width="98" height="24" rx="12" fill="#ffffff"/><text x="125.0" y="451" font-size="13" font-weight="700" fill="#6d4de0" text-anchor="middle">人确认样稿</text></g>
<g><rect x="56" y="556" width="320" height="124" rx="14" fill="#ffffff" stroke="#7c5cf5" stroke-width="2"/><text x="76" y="590" font-size="19" font-weight="700" fill="#0f172a">⑦ 整理素材、导出发品表</text><text x="76" y="618" font-size="14" fill="#475569">图片按场景命名归档,生成</text><text x="76" y="640" font-size="14" fill="#475569">Excel 发品表并展示给人看</text><rect x="76" y="650" width="126" height="24" rx="12" fill="#ede9fe"/><text x="139.0" y="667" font-size="13" font-weight="700" fill="#6d4de0" text-anchor="middle">人确认审核状态</text></g>
<g><rect x="440" y="556" width="320" height="124" rx="14" fill="url(#gc)"/><text x="460" y="590" font-size="19" font-weight="700" fill="#fff">⑧ 发品客户端</text><text x="460" y="618" font-size="14" fill="#e0f7fa">读表、检查每一行,确认后</text><text x="460" y="640" font-size="14" fill="#e0f7fa">一条一条复制商品并提交</text></g>
<g><rect x="824" y="556" width="320" height="124" rx="14" fill="#ffffff" stroke="#0ea5c6" stroke-width="2"/><text x="844" y="590" font-size="19" font-weight="700" fill="#0f172a">国际站后台</text><text x="844" y="618" font-size="14" fill="#475569">新商品上架,商品 ID</text><text x="844" y="640" font-size="14" fill="#475569">写回发品表</text></g>
<path d="M376 226 H436" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M760 226 H820" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M984 288 V336" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M824 402 H764" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M440 402 H380" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M156 464 V552" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M376 618 H436" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M760 618 H820" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="440" y="478" width="704" height="0" fill="none"/><rect x="260" y="476" width="884" height="40" rx="10" fill="#f1f5f9" opacity="0"/>
<text x="48" y="730" font-size="14" fill="#64748b">紫色:Skill 在 AccioWork 里完成  ·  青色:客户端在本机完成  ·  项目档案和辅助脚本记录每一步进度,对话中断后可以接着做</text>
<text x="48" y="754" font-size="14" fill="#64748b">Skill 不会自己启动发布,发布由运营在客户端里确认后开始</text>
</svg>
